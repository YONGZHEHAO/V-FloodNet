name: Recognize water depth samples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recognition:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.16'
      - name: Install official CPU models
        run: bash .codex/setup.sh
      - name: Check water mask regression
        run: bash .codex/run.sh -m unittest discover -s tests -v
      - name: Reproduce eight stop sign demo photos
        run: bash .codex/run.sh scripts/recognize_depth.py --input-dir assets/lake_exp --test-name lake_demo --demo
      - name: Screen source-traceable research photos
        run: >-
          bash .codex/run.sh scripts/recognize_depth.py
          --input-dir assets/hydrodynamic_events_20261103/images
          --manifest assets/hydrodynamic_events_20261103/manifest.json
          --test-name hydrodynamic118
      - name: Upload recognition reports and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-depth-recognition
          path: output/recognition/
          if-no-files-found: ignore
          retention-days: 14
